name: Radar Alternance Lyon

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Paris (heure d'hiver), 08:00 l'été
  workflow_dispatch:
    inputs:
      hours_old:
        description: "Fenêtre jobspy en heures (vide = auto : 72 au 1er run, puis 24)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        id: radar
        env:
          LBA_API_KEY: ${{ secrets.LBA_API_KEY }}
          HOURS_OLD: ${{ github.event.inputs.hours_old }}
          TZ: Europe/Paris
        run: python main.py

      - name: Commit & push new offers
        if: steps.radar.outputs.new_count != '0'
        run: |
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Rien à committer."
          else
            git commit -m "🎯 ${{ steps.radar.outputs.new_count }} nouvelle(s) offre(s) — $(date +'%d/%m/%Y')"
            git push
          fi
